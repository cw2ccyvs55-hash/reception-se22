const PARTICIPANTS = DATA;
let attendance = [];

function norm(s){ return s.replace(/[أإآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().trim(); }

function getCategory(p){
  const isVIP = p.value==='VIP';
  const isFull = p.payment==='full';
  if(isVIP && isFull) return 'vip_full';
  if(isVIP && !isFull) return 'vip_partial';
  if(!isVIP && isFull) return 'full';
  return 'partial';
}

function renderTopStats(){
  const total = PARTICIPANTS.length;
  const vipFull = PARTICIPANTS.filter(p=>getCategory(p)==='vip_full').length;
  const full = PARTICIPANTS.filter(p=>getCategory(p)==='full').length;
  const partial = PARTICIPANTS.filter(p=>p.payment==='partial').length;
  document.getElementById('topStats').innerHTML=`
    <div class="stat bl"><div class="n">${total}</div><div class="t">إجمالي</div></div>
    <div class="stat g"><div class="n">${full+vipFull}</div><div class="t">دفع كامل</div></div>
    <div class="stat gold"><div class="n">${vipFull}</div><div class="t">VIP</div></div>
    <div class="stat r"><div class="n">${partial}</div><div class="t">باقي مبلغ</div></div>
  `;
}
renderTopStats();

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',
    (tab==='search'&&i===0)||(tab==='stats'&&i===1)));
  document.getElementById('searchPanel').style.display=tab==='search'?'block':'none';
  document.getElementById('statsPanel').style.display=tab==='stats'?'block':'none';
  if(tab==='stats') renderStatsPanel();
}

function hs(){
  const q=document.getElementById('si').value.trim();
  const sg=document.getElementById('sugg');
  const rb=document.getElementById('result');
  if(!q){sg.style.display='none';rb.innerHTML='';return;}
  const matches=PARTICIPANTS.filter(p=>norm(p.name).includes(norm(q)));
  if(matches.length===1){sg.style.display='none';showResult(matches[0]);}
  else if(matches.length>1){
    rb.innerHTML='';sg.style.display='block';
    sg.innerHTML=matches.map(p=>`<div class="si" onclick="selP(${p.rowNum})">
      <span>${p.name}</span><span class="sp">${p.phone}</span></div>`).join('');
  } else {
    sg.style.display='none';
    rb.innerHTML=`<div class="rc cn"><span class="ib">❓</span><div class="nm">غير موجود</div>
    <div class="vd">الاسم غير مسجل في القائمة</div></div>`;
  }
}

function selP(rowNum){
  const p=PARTICIPANTS.find(x=>x.rowNum===rowNum);
  document.getElementById('sugg').style.display='none';
  document.getElementById('si').value=p.name;
  showResult(p);
}

function showResult(p){
  const cat=getCategory(p);
  let cls,icon,verdict;
  if(cat==='vip_full'){cls='cgo';icon='👑';verdict='✅ VIP — دفع كامل<br><small>وجّهه لمقاعد VIP</small>';}
  else if(cat==='vip_partial'){cls='cr';icon='👑';verdict='❌ VIP — باقي مبلغ<br><small>وجّهه للحسابات أولاً</small>';}
  else if(cat==='full'){cls='cg';icon='✅';verdict='يدخل مباشرة';}
  else{cls='cr';icon='⚠️';verdict='باقي مبلغ — وجّهه للحسابات';}

  const already=attendance.find(a=>a.rowNum===p.rowNum);
  const enteredBadge=already?`<div style="color:#fbbf24;font-size:.8rem;margin-bottom:8px">⏱ دخل: ${already.time}</div>`:'';

  document.getElementById('result').innerHTML=`
    <div class="rc ${cls}">
      <span class="ib">${icon}</span>
      <div class="lbl">مشترك</div>
      <div class="nm">${p.name}</div>
      <div class="ph">${p.phone}</div><br>
      ${p.value!=='-'?`<span class="badge">${p.value==='VIP'?'VIP':p.value+' $'}</span><br>`:''}
      ${enteredBadge}
      <div class="vd">${verdict}</div>
      ${(cat==='vip_full'||cat==='full')&&!already?`<br><button onclick="markEntered(${p.rowNum})"
        style="margin-top:12px;padding:8px 20px;background:rgba(16,185,129,.2);border:1px solid #10b981;
        border-radius:8px;color:#34d399;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;font-size:.9rem">
        ✔ تسجيل الدخول</button>`:''}
    </div>`;
}

async function markEntered(rowNum){
  if(attendance.find(a=>a.rowNum===rowNum)) return;
  const p=PARTICIPANTS.find(x=>x.rowNum===rowNum);
  const now=new Date();
  const time=now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
  attendance.push({rowNum,name:p.name,phone:p.phone,value:p.value,payment:p.payment,time});
  
  // الكتابة في الشيت
  try{
    await fetch('https://script.google.com/macros/s/AKfycbwTl_D09yrteOtnsl0NcIqL_RkgM_mteGMXGK9zCdck1kVgiziKDGcaAaVjvzDozA3OMw/exec',{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({rowNum,time})
    });
  }catch(e){console.log('حُفظ محلياً');}
  
  renderTopStats();
  showResult(p);
}

function renderStatsPanel(){
  const total=PARTICIPANTS.length;
  const entered=attendance.length;
  const vipIn=attendance.filter(a=>a.value==='VIP').length;
  const normalIn=entered-vipIn;
  const pct=total>0?Math.round(entered/total*100):0;
  document.getElementById('statGrid').innerHTML=`
    <div class="sg bl"><div class="sn">${entered}</div><div class="st">دخلوا الورشة</div>
      <div class="pct-bar"><div class="pct-fill" style="width:${pct}%;background:#3b82f6"></div></div></div>
    <div class="sg"><div class="sn" style="color:#94a3b8">${total-entered}</div><div class="st">لم يصلوا بعد</div></div>
    <div class="sg gold"><div class="sn">${vipIn}</div><div class="st">VIP دخلوا</div></div>
    <div class="sg g"><div class="sn">${normalIn}</div><div class="st">عاديين دخلوا</div></div>
  `;
  const items=document.getElementById('attItems');
  if(!attendance.length){
    items.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:.9rem">لم يتم تسجيل أي دخول بعد</div>';
  } else {
    items.innerHTML=[...attendance].reverse().map(a=>`
      <div class="att-item">
        <span><span class="dot ${a.value==='VIP'?'gold':'g'}"></span><span class="an">${a.name}</span></span>
        <span class="at">${a.time}</span>
      </div>`).join('');
  }
}

function exportCSV(){
  if(!attendance.length){alert('لا يوجد سجل دخول بعد');return;}
  const rows=[['الاسم','رقم الهاتف','القيمة','حالة الدفع','وقت الدخول']];
  attendance.forEach(a=>rows.push([a.name,a.phone,a.value,a.payment==='full'?'دفع كامل':'باقي مبلغ',a.time]));
  const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`سجل_دخول_SE_22_${new Date().toLocaleDateString('ar')}.csv`;
  a.click();
}
